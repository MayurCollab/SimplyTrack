<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimplyTrack OTP</title>
</head>
<body style="margin:0;padding:0;background:#F8F9FA;font-family:Inter,system-ui,-apple-system,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F8F9FA;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:480px;background:#FFFFFF;border-radius:12px;padding:32px;border:1px solid #E5E7EB;">
          <tr>
            <td>
              <p style="margin:0 0 8px;font-size:20px;font-weight:600;color:#111827;">SimplyTrack</p>
              <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#374151;">
                Hi {{name}},
              </p>
              <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#374151;">
                Welcome to SimplyTrack! Use the OTP below to verify your login and get started with tracking your time and tasks.
              </p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:0 0 24px;">
                <tr>
                  <td align="center" style="border:2px solid #4F46E5;border-radius:10px;padding:16px 24px;">
                    <span style="font-size:28px;letter-spacing:8px;font-weight:700;color:#4F46E5;">{{otp}}</span>
                  </td>
                </tr>
              </table>
              <p style="margin:0 0 24px;font-size:14px;line-height:1.5;color:#6B7280;">
                This code is valid for 5 minutes. Please do not share it with anyone.
              </p>
              <p style="margin:0;font-size:15px;line-height:1.5;color:#374151;">
                Best Regards,<br />
                Team SimplyTrack.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
